<!DOCTYPE html>
<html>
<head>
    <title>User Management</title>
</head>
<body>

<h1>👥 User Management</h1>

<form method="GET">
    <input type="text"
           name="search"
           placeholder="Search User"
           value="{{ search }}">

    <button type="submit">Search</button>
</form>

<br>

<table border="1" cellpadding="10">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Role</th>
    <th>Action</th>
</tr>

{% for user in users %}

<tr>

<td>{{ user[0] }}</td>
<td>{{ user[1] }}</td>
<td>{{ user[2] }}</td>
<td>{{ user[3] }}</td>

<td>

<a href="/delete_user/{{ user[0] }}"
onclick="return confirm('Delete User?')">

Delete

</a>

</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/admin">⬅ Back to Admin Dashboard</a>

</body>
</html>
